<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deep Teardown — Inside the Phone Camera</title>
<style>
  :root { --cyan: #dcb46c; --gold: #dcb46c; --bg: #05070b; --ink: #f1ede4; --dim: #8d8a82; }
  @font-face { font-family: "Barlow Condensed"; font-weight: 600; src: url(assets/fonts/barlow-condensed-latin-600-normal.woff2) format("woff2"); }
  @font-face { font-family: "Barlow Condensed"; font-weight: 700; src: url(assets/fonts/barlow-condensed-latin-700-normal.woff2) format("woff2"); }
  @font-face { font-family: "Manrope"; font-weight: 500; src: url(assets/fonts/manrope-latin-500-normal.woff2) format("woff2"); }
  @font-face { font-family: "JetBrains Mono"; font-weight: 500; src: url(assets/fonts/jetbrains-mono-latin-500-normal.woff2) format("woff2"); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--ink); overflow: hidden;
    font-family: "Manrope", "Helvetica Neue", Arial, system-ui, sans-serif; }
  #app { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #stage { position: relative; background: var(--bg); overflow: hidden; container-type: size; }
  #stage canvas { display: block; width: 100%; height: 100%; }
  #overlay, #fade { position: absolute; inset: 0; pointer-events: none; }
  #fade { background: #000; opacity: 0; }
  .lbl { position: absolute; left: 0; top: 0; white-space: nowrap; font: 500 1.02cqw "JetBrains Mono", monospace; letter-spacing: .1em;
    padding: .5em .8em .5em 1.7em; background: rgba(8, 11, 16, .72); border-radius: .25em;
    color: var(--ink); text-transform: uppercase; will-change: transform, opacity; }
  .lbl::before { content: ""; position: absolute; left: .7em; top: 50%; width: .5em; height: .5em; margin-top: -.25em; background: var(--gold); }
  .lbl.big::before, .lbl.num::before { display: none; }
  .lbl.big { font: 700 3.6cqw "Barlow Condensed", sans-serif; padding: 0; background: none; letter-spacing: .03em; text-shadow: 0 0 1.2em #000; }
  .lbl.bad { border-color: #ff5a5a; color: #ffb3b3; }
  .lbl.good { border-color: #49e06a; color: #c4f7cf; }
  .lbl.num { border: .12em solid var(--cyan); border-radius: 50%; width: 2em; height: 2em; padding: 0; display: grid; font-family: 'Barlow Condensed', sans-serif;
    place-items: center; font-size: 1.9cqw; font-weight: 800; background: rgba(5, 9, 15, .8); color: var(--cyan); }
  .lbl.num.r { color: #ff6b6b; border-color: #ff6b6b; } .lbl.num.g { color: #5fe57d; border-color: #5fe57d; } .lbl.num.b { color: #6f9bff; border-color: #6f9bff; }
  .lbl.stage { border: .1em solid #2b3a4d; border-radius: 99em; font-size: 1.15cqw; color: var(--dim); background: rgba(5, 9, 15, .8); }
  .lbl.stage.on { border-color: var(--cyan); color: #fff; box-shadow: 0 0 1.4em rgba(79, 227, 255, .45); }
  #title { position: absolute; left: 4cqw; bottom: 13cqh; opacity: 0; transition: opacity .6s; }
  #title small { display: block; color: var(--cyan); font-size: 1.3cqw; letter-spacing: .28em; text-transform: uppercase; font-weight: 700; }
  #title b { display: block; font-size: 3.4cqw; font-weight: 800; letter-spacing: -.01em; margin-top: .15em; text-shadow: 0 0 1em #000; }
  #brand { position: absolute; right: 2cqw; top: 1.8cqw; width: 3cqw; height: 3cqw; border-radius: 50%; display: grid; place-items: center;
    background: rgba(5, 7, 11, .85); border: .14cqw solid var(--gold); color: var(--ink); font: 700 1.5cqw "Barlow Condensed", sans-serif; letter-spacing: .04em; }
  #clip, #card { position: absolute; inset: 0; width: 100%; height: 100%; display: none; }
  #head { position: absolute; opacity: 0; max-width: 70cqw; isolation: isolate; }
  #head.pos-tl { left: 5.5cqw; top: 9cqh; } #head.pos-bl { left: 5.5cqw; bottom: 12cqh; }
  #head.pos-c { left: 50%; top: 44cqh; transform: translateX(-50%); text-align: center; }
  #head::before { content: ""; position: absolute; inset: -3cqw -6cqw -3cqw -6cqw; z-index: -1; background: radial-gradient(closest-side, rgba(3,5,8,.62), rgba(3,5,8,0)); }
  #head b { display: block; font: 600 3.9cqw/1.05 "Barlow Condensed", sans-serif; letter-spacing: .035em; white-space: nowrap; text-shadow: 0 0 .6em rgba(0,0,0,.9), 0 0 1.6em rgba(0,0,0,.7); }
  #head.pos-c b { font-size: 7cqw; }
  #head i { display: block; height: .16cqw; background: var(--gold); margin: .5cqw 0 .7cqw; width: 0; }
  #head span { display: block; font: 500 1.5cqw "Manrope", sans-serif; color: #d6d2c8; text-shadow: 0 0 .8em #000, 0 0 .3em #000; }
  #tag { position: absolute; left: 5.5cqw; top: 62cqh; opacity: 0; background: rgba(8, 11, 16, .78); border-radius: .3cqw; padding: .7cqw 1cqw .7cqw 2.2cqw;
    font: 500 1.3cqw "JetBrains Mono", monospace; letter-spacing: .12em; }
  #tag::before { content: ""; position: absolute; left: .9cqw; top: 1.1cqw; width: .6cqw; height: .6cqw; background: var(--gold); }
  #tag span { display: block; font-size: .85cqw; color: #a9a59b; margin-top: .3cqw; }
  #tag u { display: inline-block; width: .6em; height: 1em; background: var(--gold); vertical-align: -.15em; margin-left: .2em; text-decoration: none; }
  #cc { position: absolute; left: 50%; bottom: 4.2cqh; transform: translateX(-50%); max-width: 78cqw; text-align: center;
    font-size: 1.75cqw; line-height: 1.35; padding: .3em .8em; background: rgba(0, 0, 0, .66); border-radius: .3em; opacity: 0; }
  #bar { width: 100%; max-width: 1400px; display: flex; gap: 10px; align-items: center; padding: 8px 14px; font-size: 13px;
    background: #0a0d13; border-top: 1px solid #18202c; }
  #bar button { background: #141b26; color: var(--ink); border: 1px solid #263244; border-radius: 6px; padding: 6px 10px; cursor: pointer; font: inherit; }
  #bar button:hover, #bar button.on { border-color: var(--cyan); color: #fff; }
  #play { min-width: 74px; font-weight: 700; }
  #seek { flex: 1; min-width: 80px; accent-color: var(--cyan); }
  #time { font-variant-numeric: tabular-nums; color: var(--dim); min-width: 96px; text-align: center; }
  #chips { display: flex; gap: 4px; flex-wrap: wrap; }
  body.clean #bar { display: none; }
  body.nocc #cc { display: none; }
  @media (max-width: 760px) { #chips { display: none; } }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="clip" width="1280" height="720"></canvas>
    <canvas id="card" width="1920" height="1080"></canvas>
    <div id="overlay"></div>
    <div id="head"><b></b><i></i><span></span></div>
    <div id="tag"><b></b><u></u><span></span></div>
    <div id="brand">DT</div>
    <div id="cc"></div>
    <div id="fade"></div>
  </div>
  <div id="bar">
    <button id="play">▶ Play</button>
    <span id="time">0:00 / 0:00</span>
    <input id="seek" type="range" min="0" max="1000" value="0" step="0.01" aria-label="Seek">
    <span id="chips"></span>
    <button id="ccb" class="on" title="Captions (C)">CC</button>
    <button id="mute" title="Mute narration (M)">🔊</button>
  </div>
</div>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
<script type="module" src="src/main.js"></script>
</body>
</html>
