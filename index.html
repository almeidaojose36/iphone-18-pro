<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iPhone 18 Pro Teardown</title>
<link rel="icon" href="data:,">
<style>
  :root { --ink: #f5f5f7; --dim: #86868b; --line: rgba(255, 255, 255, .55); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { font-family: "Inter Display", "Inter", -apple-system, "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  /* 16:9 stage, letterboxed. All overlay sizes are in --u (1% of stage height) so any render size matches. */
  #stage { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: min(100vw, 177.778vh); height: min(100vh, 56.25vw); --u: min(1vh, .5625vw); overflow: hidden; background: #000; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #overlay, #lines, #scrim, #black, #vignette { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #vignette { background: radial-gradient(ellipse at 50% 46%, rgba(0, 0, 0, 0) 45%, rgba(0, 0, 0, .55) 100%); }
  #scrim { background: #000; opacity: 0; }
  #black { background: #000; opacity: 0; }
  #lines line { stroke: #fff; stroke-opacity: .6; stroke-width: 1; vector-effect: non-scaling-stroke; }
  #lines circle { fill: #fff; }

  /* centred statements: words light up one after another */
  .headline { position: absolute; left: 0; right: 0; transform: translateY(-50%); text-align: center; padding: 0 calc(var(--u) * 12); }
  .headline .k { font-size: calc(var(--u) * 2.1); letter-spacing: .32em; text-transform: uppercase; color: var(--dim); font-weight: 500; margin-bottom: calc(var(--u) * 1.6); }
  .headline .t { font-size: calc(var(--u) * 4.6); font-weight: 500; letter-spacing: -.012em; line-height: 1.16; text-wrap: balance; text-shadow: 0 0 calc(var(--u) * 2.4) rgba(0, 0, 0, .9), 0 0 calc(var(--u) * .6) rgba(0, 0, 0, .7); }
  .headline.big .t { font-size: calc(var(--u) * 8.6); font-weight: 600; letter-spacing: -.028em; }
  .headline.small .t { font-size: calc(var(--u) * 4.0); }
  .headline .s { font-size: calc(var(--u) * 2.3); color: var(--dim); font-weight: 400; margin-top: calc(var(--u) * 1.2); text-shadow: 0 0 calc(var(--u) * 1.6) #000; }
  .headline .t span { display: inline-block; white-space: pre; will-change: opacity, filter; }

  /* part labels: a hairline to the part, name and a quiet second line */
  .label { position: absolute; transform: translate(-50%, -50%); white-space: nowrap; text-shadow: 0 0 calc(var(--u) * 1.4) #000, 0 0 calc(var(--u) * .5) #000; }
  .label b { display: block; font-size: calc(var(--u) * 2.9); font-weight: 500; letter-spacing: -.005em; }
  .label span { display: block; font-size: calc(var(--u) * 2.1); color: #a1a1a6; margin-top: calc(var(--u) * .25); }
  .label.left { text-align: right; } .label.right { text-align: left; }

  /* big numbers */
  .stat { position: absolute; transform: translate(-50%, -50%); text-align: center; white-space: nowrap; text-shadow: 0 0 calc(var(--u) * 3) #000; }
  .stat .n { font-size: calc(var(--u) * 11.5); font-weight: 600; letter-spacing: -.035em; line-height: 1; font-variant-numeric: tabular-nums;
    background: linear-gradient(180deg, #fff 20%, #a9a9b2 100%); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }
  .stat .c { font-size: calc(var(--u) * 2.5); color: #a1a1a6; margin-top: calc(var(--u) * 1); }
  .stat .bars { display: flex; gap: calc(var(--u) * .7); justify-content: center; margin-top: calc(var(--u) * 2); }
  .stat .bars i { width: calc(var(--u) * 3); height: calc(var(--u) * .7); border-radius: calc(var(--u) * .4); background: #2c2c2e; }

  #ui { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 12px; align-items: center; padding: 10px 14px;
    background: rgba(10, 10, 12, .9); font-size: 13px; z-index: 5; }
  #ui button, #ui label { background: #1c1c1e; color: var(--ink); border: 1px solid #3a3a3c; border-radius: 6px; padding: 6px 12px; cursor: pointer; font: inherit; }
  #ui input[type=range] { flex: 1; accent-color: #fff; }
  #ui output { font-variant-numeric: tabular-nums; min-width: 110px; text-align: right; color: var(--dim); }
  body.render #ui { display: none; }
</style>
<script type="importmap">
{ "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/" } }
</script>
</head>
<body>
<div id="stage">
  <canvas id="view"></canvas>
  <div id="vignette"></div>
  <div id="scrim"></div>
  <svg id="lines"></svg>
  <div id="overlay"></div>
  <div id="black"></div>
</div>
<div id="ui">
  <button id="play">Pause</button>
  <input id="scrub" type="range" min="0" max="300" step="0.01" value="0">
  <output id="clock">0.00 s</output>
  <label><input id="free" type="checkbox"> Free camera</label>
  <button id="glb">Export .glb</button>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
