<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deep Teardown — Inside the Phone Camera</title>
<style>
  :root { --cyan: #4fe3ff; --gold: #ffc65a; --bg: #05070b; --ink: #e9eef6; --dim: #8b97a8; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--ink); overflow: hidden;
    font-family: "Inter", "Helvetica Neue", Arial, system-ui, sans-serif; }
  #app { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #stage { position: relative; background: var(--bg); overflow: hidden; container-type: size; }
  #stage canvas { display: block; width: 100%; height: 100%; }
  #overlay, #fade { position: absolute; inset: 0; pointer-events: none; }
  #fade { background: #000; opacity: 0; }
  .lbl { position: absolute; left: 0; top: 0; white-space: nowrap; font-size: 1.45cqw; letter-spacing: .04em;
    padding: .35em .7em; border-left: .18em solid var(--cyan); background: rgba(5, 9, 15, .62);
    color: var(--ink); text-transform: uppercase; font-weight: 600; will-change: transform, opacity; }
  .lbl.big { font-size: 3cqw; font-weight: 800; border: 0; background: none; letter-spacing: .02em; text-shadow: 0 0 1.2em #000; }
  .lbl.bad { border-color: #ff5a5a; color: #ffb3b3; }
  .lbl.good { border-color: #49e06a; color: #c4f7cf; }
  .lbl.num { border: .12em solid var(--cyan); border-radius: 50%; width: 2em; height: 2em; padding: 0; display: grid;
    place-items: center; font-size: 1.9cqw; font-weight: 800; background: rgba(5, 9, 15, .8); color: var(--cyan); }
  .lbl.num.r { color: #ff6b6b; border-color: #ff6b6b; } .lbl.num.g { color: #5fe57d; border-color: #5fe57d; } .lbl.num.b { color: #6f9bff; border-color: #6f9bff; }
  .lbl.stage { border: .1em solid #2b3a4d; border-radius: 99em; font-size: 1.15cqw; color: var(--dim); background: rgba(5, 9, 15, .8); }
  .lbl.stage.on { border-color: var(--cyan); color: #fff; box-shadow: 0 0 1.4em rgba(79, 227, 255, .45); }
  #title { position: absolute; left: 4cqw; bottom: 13cqh; opacity: 0; transition: opacity .6s; }
  #title small { display: block; color: var(--cyan); font-size: 1.3cqw; letter-spacing: .28em; text-transform: uppercase; font-weight: 700; }
  #title b { display: block; font-size: 3.4cqw; font-weight: 800; letter-spacing: -.01em; margin-top: .15em; text-shadow: 0 0 1em #000; }
  #brand { position: absolute; right: 2.2cqw; top: 2cqw; font-size: 1.05cqw; letter-spacing: .3em; color: var(--dim); font-weight: 700; }
  #cc { position: absolute; left: 50%; bottom: 4.2cqh; transform: translateX(-50%); max-width: 78cqw; text-align: center;
    font-size: 1.75cqw; line-height: 1.35; padding: .3em .8em; background: rgba(0, 0, 0, .66); border-radius: .3em; opacity: 0; }
  #bar { width: 100%; max-width: 1400px; display: flex; gap: 10px; align-items: center; padding: 8px 14px; font-size: 13px;
    background: #0a0d13; border-top: 1px solid #18202c; }
  #bar button { background: #141b26; color: var(--ink); border: 1px solid #263244; border-radius: 6px; padding: 6px 10px; cursor: pointer; font: inherit; }
  #bar button:hover, #bar button.on { border-color: var(--cyan); color: #fff; }
  #play { min-width: 74px; font-weight: 700; }
  #seek { flex: 1; min-width: 80px; accent-color: var(--cyan); }
  #time { font-variant-numeric: tabular-nums; color: var(--dim); min-width: 96px; text-align: center; }
  #chips { display: flex; gap: 4px; flex-wrap: wrap; }
  body.clean #bar { display: none; }
  body.nocc #cc { display: none; }
  @media (max-width: 760px) { #chips { display: none; } }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="overlay"></div>
    <div id="brand">DEEP TEARDOWN</div>
    <div id="title"><small></small><b></b></div>
    <div id="cc"></div>
    <div id="fade"></div>
  </div>
  <div id="bar">
    <button id="play">▶ Play</button>
    <span id="time">0:00 / 0:00</span>
    <input id="seek" type="range" min="0" max="1000" value="0" step="0.01" aria-label="Seek">
    <span id="chips"></span>
    <button id="ccb" class="on" title="Captions (C)">CC</button>
    <button id="mute" title="Mute narration (M)">🔊</button>
  </div>
</div>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
<script type="module" src="src/main.js"></script>
</body>
</html>
